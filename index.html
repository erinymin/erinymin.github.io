<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound</title>
  <style>
    @font-face {
      font-family: 'Absans';
      src: local('Absans'), url('Absans-Regular.woff2') format('woff2'),
           url('Absans-Regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #e8e7d5);
      font-family: 'Absans';
      color: #3f3f3d;
      text-align: center;
      position: relative;
      overflow: hidden;
      flex-direction: column;
    }

    .aura {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 10%, rgba(255,255,255,0.1) 70%);
      filter: blur(15px);
      animation: aura-float 6s infinite ease-in-out;
      cursor: pointer;
      z-index: 0;
    }

    @keyframes aura-float {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }

    .center-text { font-size: 34px; font-weight: bold; }
    .top-text { font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="top-text">Click on the colors!</div>
  <div class="center-text">What I hear everyday</div>

  <script>
    const dataSets = [
      { date: "2/27, Thursday", color: "#c7dc8e", sound: "1.m4a" },
      { date: "2/28, Friday", color: "#f6e98e", sound: "2.m4a" },
      { date: "3/1, Saturday", color: "#99D2E9", sound: "3.m4a" },
      { date: "2/27, Thursday", color: "#c7dc8e", sound: "4.m4a" },
      { date: "2/28, Friday", color: "#f6e98e", sound: "5.m4a" },
      { date: "3/1, Saturday", color: "#c7dc8e", sound: "6.m4a" },
      { date: "3/1, Saturday", color: "#f6e98e", sound: "7.m4a" },
      { date: "3/1, Saturday", color: "#99D2E9", sound: "8.m4a" },
      { date: "3/1, Saturday", color: "#c7dc8e", sound: "9.m4a" },
      { date: "3/1, Saturday", color: "#99D2E9", sound: "10.m4a" }
    ];

    function createAuras() {
      const container = document.body;
      dataSets.forEach((data) => {
        let auraSize = Math.random() * 100 + 60;

        const aura = document.createElement("div");
        aura.classList.add("aura");
        aura.style.left = `${Math.random() * 90}vw`;
        aura.style.top = `${Math.random() * 80}vh`;
        aura.style.width = `${auraSize}px`;
        aura.style.height = `${auraSize}px`;
        aura.style.backgroundColor = data.color;

        aura.addEventListener("click", () => {
          playSound(data.sound);
        });

        container.appendChild(aura);
      });
    }

    function playSound(src) {
      const audio = new Audio(src);
      audio.currentTime = 0;
      audio.play();
    }

    createAuras();
  </script>
</body>
</html>
