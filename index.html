<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Take a Pic!</title>
  <style>
    :root { --w: 900px; --h: 540px; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background-image: url('web.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ddd;
    }

    .container {
      width: var(--w);
      height: var(--h);
      display: flex;
      gap: 24px;
      align-items: stretch;
    }

    .panel {
      flex: 1 1 0;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
    }

    .mosaic-panel {
      background: transparent;
      box-shadow: none;
    }

    .video-panel {
      border: 20px solid transparent;
      border-image-source: url('tab.png');
      border-image-repeat: stretch;
      border-image-width: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      background: #222;
    }

    .video-panel video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    #mosaic {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status {
      display: none;
    }

    #capture-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 100px;
      height: 40px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel mosaic-panel">
      <canvas id="mosaic"></canvas>
      <div id="status">Loading…</div>
    </div>

    <div class="panel video-panel">
      <video id="video" autoplay muted playsinline></video>
    </div>
  </div>

  <img id="capture-btn" src="button.png" alt="Take Photo">

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <script>
  (async function () {
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/cgarciagl/face-api.js/weights/';
    const video = document.getElementById('video');
    const canvas = document.getElementById('mosaic');
    const ctx = canvas.getContext('2d');
    let videoReady = false;

    const boxBorderImg = new Image();
    boxBorderImg.src = 'tab.png';
    await new Promise(resolve => { boxBorderImg.onload = resolve; });

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          videoReady = true;
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          resolve();
        };
      });
    }

    async function loadModels() {
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    }

    function drawFragmentedWindows(detection, landmarks) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const features = [
        landmarks.getLeftEye(),
        landmarks.getRightEye(),
        landmarks.getNose(),
        landmarks.getMouth()
      ];

      for (const feature of features) {
        const xs = feature.map(p => p.x);
        const ys = feature.map(p => p.y);
        const minX = Math.min(...xs) - 20;
        const minY = Math.min(...ys) - 20;
        const maxX = Math.max(...xs) + 20;
        const maxY = Math.max(...ys) + 20;
        const width = maxX - minX;
        const height = maxY - minY;

        for (let i = 0; i < 15; i++) {
          const offsetX = (Math.random() - 0.5) * 6;
          const offsetY = (Math.random() - 0.5) * 6;
          ctx.save();
          ctx.translate(offsetX, offsetY);

          ctx.drawImage(video, minX, minY, width, height, minX, minY, width, height);

          ctx.drawImage(boxBorderImg, minX, minY, width, height);

          ctx.restore();
        }
      }
    }

    async function detectLoop() {
      if (videoReady) {
        const result = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks();

        if (result) {
          drawFragmentedWindows(result.detection, result.landmarks);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(detectLoop);
    }

    await startCamera();
    await loadModels();
    detectLoop();

    const captureBtn = document.getElementById('capture-btn');
    captureBtn.addEventListener('click', () => {
      const image = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = image;
      link.download = 'fragmented_face.png';
      link.click();
    });
  })();
  </script>
</body>
</html>
