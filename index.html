<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound</title>
  <style>
    @font-face {
      font-family: 'Absans';
      src: local('Absans'), url('Absans-Regular.woff2') format('woff2'),
           url('Absans-Regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #e8e7d5);
      font-family: 'Absans';
      color: #3f3f3d;
      text-align: center;
      position: relative;
      overflow: hidden;
      flex-direction: column;
    }

    .aura {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 10%, rgba(255,255,255,0.1) 70%);
      filter: blur(15px);
      animation: aura-float 6s infinite ease-in-out;
      cursor: pointer;
      z-index: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes aura-float {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }

    .center-text { font-size: 34px; font-weight: bold; z-index: 2; }
    .top-text { font-size: 18px; font-weight: bold; z-index: 2; }

    .aura-text {
      position: absolute;
      color: #3f3f3d;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 5;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
    }

    .aura-text.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="top-text">Click on the colors!</div>
  <div class="center-text">What I hear everyday</div>

  <script>
    const dataSets = [
      { date: "i love when it's quiet during midnight", color: "#c7dc8e", sound: "1.m4a" },
      { date: "silence is my favorite part of my home", color: "#f6e98e", sound: "2.m4a" },
      { date: "sometimes it gets loud because i live in between roads", color: "#99D2E9", sound: "3.m4a" },
      { date: "i like overhearing conversations during the afternoon", color: "#c7dc8e", sound: "4.m4a" },
      { date: "the birds get loud sometimes", color: "#f6e98e", sound: "5.m4a" },
      { date: "i can hear the birds talking to eachother", color: "#c7dc8e", sound: "6.m4a" },
      { date: "i hear firetrucks a lot since there is a station next to me", color: "#f6e98e", sound: "7.m4a" },
      { date: "loud weekday's are not my favorite", color: "#99D2E9", sound: "8.m4a" },
      { date: "sometimes the wind is loud", color: "#c7dc8e", sound: "9.m4a" },
      { date: "i hear the leaves being walked on", color: "#99D2E9", sound: "10.m4a" }
    ];

    function createAuras() {
      const container = document.body;
      dataSets.forEach((data) => {
        let auraSize = Math.random() * 100 + 60;

        const aura = document.createElement("div");
        aura.classList.add("aura");
        aura.style.left = `${Math.random() * 90}vw`;
        aura.style.top = `${Math.random() * 80}vh`;
        aura.style.width = `${auraSize}px`;
        aura.style.height = `${auraSize}px`;
        aura.style.backgroundColor = data.color;

        // create text element
        const text = document.createElement("div");
        text.classList.add("aura-text");
        text.textContent = data.date;
        container.appendChild(text);

        aura.addEventListener("click", () => {
          playSound(data.sound);
          showText(aura, text);
        });

        container.appendChild(aura);
      });
    }

    function playSound(src) {
      const audio = new Audio(src);
      audio.currentTime = 0;
      audio.play();
    }

    function showText(aura, text) {
      const auraRect = aura.getBoundingClientRect();
      text.style.left = `${auraRect.left + auraRect.width / 2}px`;
      text.style.top = `${auraRect.top - 25}px`;

      text.classList.add("show");
      setTimeout(() => {
        text.classList.remove("show");
      }, 4000); // ⏳ text stays visible for 4 seconds
    }

    createAuras();
  </script>
</body>
</html>
